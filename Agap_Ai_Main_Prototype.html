<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:linear-gradient(#CEECF2,#F4FBFE) fixed;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0F172A;margin:0}
.card{background:#fff;border-radius:1.5rem;box-shadow:0 8px 24px -10px rgba(15,23,42,.18)}
.pulse{animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(242,183,5,.55)}100%{box-shadow:0 0 0 20px rgba(242,183,5,0)}}
.view{animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.beat{transform:scale(1.35);background:#F2B705!important}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
:root.dark{color-scheme:dark;--lh:#2F8FE0;--lw:#5BB8F0}
.dark body{background:linear-gradient(#0A1424,#101F36) fixed;color:#E6EEF7}
.dark .card{background-color:#16243A}
.dark .bg-white{background-color:#1B2D48;color:#E6EEF7}
.dark .bg-white\/90{background-color:rgba(10,20,36,.92)}
.dark [class*="to-white"]{background-image:linear-gradient(160deg,#1D3A5E,#16243A)}
.dark [class*="bg-[#CEECF2]"]{background-color:#1D3A5E;color:#9AD3F5}
.dark .text-slate-500,.dark .text-slate-600,.dark .text-slate-700{color:#A9BBD0}
.dark [class*="text-[#0B7ABF]"]{color:#6DBDF2}
.dark [class*="border-[#91C4D9]"]{border-color:rgba(145,196,217,.25)}
.dark .sb{background-color:rgba(10,20,36,.92);color:#E6EEF7}
.dark [class*="bg-[#0F172A]"]{box-shadow:0 0 0 1px rgba(255,255,255,.3)}
button,a{-webkit-tap-highlight-color:transparent}
.nosel{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
:focus-visible{outline:3px solid #0B7ABF;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*{scrollbar-width:thin;scrollbar-color:#91C4D9 transparent}
@supports selector(::-webkit-scrollbar){*{scrollbar-width:auto;scrollbar-color:auto}::-webkit-scrollbar{height:6px;width:6px}::-webkit-scrollbar-button{display:none;width:0;height:0}::-webkit-scrollbar-thumb{background:#91C4D9;border-radius:9999px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-corner{background:transparent}}
</style></head>

const CT={
bleeding:{s:{en:["Check the scene is safe. Wear gloves or slip a clean plastic bag over your hand.","Call 911, or ask someone nearby to call.","Press firmly on the wound with a clean cloth and keep pressing.","If blood soaks through, add more cloth on top. Don’t lift the first one.","Lay the person down and raise the injured limb if you can.","Wrap firmly with a bandage and stay until help arrives."],
tl:["Tiyaking ligtas ang paligid. Magsuot ng guwantes o balutin ng malinis na plastik ang kamay.","Tumawag sa 911 o magpatawag sa kasama.","Idiin nang mahigpit sa sugat ang malinis na tela at huwag bitawan.","Kung nababasa ng dugo, dagdagan ng tela sa ibabaw; huwag alisin ang unang tela.","Ihiga ang tao at itaas ang sugatang bahagi kung kaya.","Balutin nang mahigpit ng benda at samahan hanggang dumating ang tulong."],
ceb:["Siguroha nga luwas ang palibot. Magsuot og guwantes o putlia ang kamot og limpyo nga plastik.","Tawag sa 911 o pasugoa ang uban nga motawag.","Pislita pag-ayo ang samad gamit ang limpyo nga panapton ug ayaw kini ibton.","Kung nabasa sa dugo, dugangi og panapton sa ibabaw; ayaw tangtanga ang una nga panapton.","Pahigdaa ang tawo ug itaas ang samad nga bahin kung mahimo.","Putlia pag-ayo og bendahe ug pabilin hangtod moabot ang tabang."]},
no:{en:"Don’t remove a cloth that is soaked with blood, and don’t pull out an object stuck in the wound.",tl:"Huwag alisin ang telang basa ng dugo at huwag bunutin ang bagay na nakabaon sa sugat.",ceb:"Ayaw tangtanga ang panapton nga nabasa sa dugo ug ayaw bunuta ang butang nga nakasulod sa samad."},
help:{en:"Call 911 if blood spurts, doesn’t slow after 10 minutes of pressure, or the person is pale, faint or confused.",tl:"Tumawag sa 911 kung bumubulwak ang dugo, hindi bumabagal pagkatapos ng 10 minutong pagdiin, o ang tao ay namumutla, nahihilo o nalilito.",ceb:"Tawag sa 911 kung nagsirit ang dugo, wala mohinay human sa 10 ka minuto nga pagpislit, o ang tawo maluspad, mahubsan sa kusog o naglibog."}},
burn:{s:{en:["Move away from the heat source: hot motorcycle exhaust, stove or hot liquid.","Cool the burn under clean running water for 20 minutes.","Gently remove rings, watches and loose clothing near the burn before it swells. Leave anything stuck to the skin.","Cover loosely with a clean, non-fluffy cloth or cling film.","Keep the rest of the body warm and watch for signs of shock."],
tl:["Lumayo sa pinagmumulan ng init: mainit na tambutso, kalan o mainit na likido.","Palamigin ang paso sa malinis na umaagos na tubig sa loob ng 20 minuto.","Dahan-dahang alisin ang singsing, relo at maluwag na damit malapit sa paso bago ito mamaga. Iwan ang anumang dumikit sa balat.","Takpan nang maluwag ng malinis na telang walang himulmol o cling film.","Panatilihing mainit ang katawan at bantayan ang senyales ng shock."],
ceb:["Pahawa sa gigikanan sa kainit: init nga tambutso, kalan o init nga likido.","Palugnawa ang paso sa limpyo nga nagaagos nga tubig sulod sa 20 ka minuto.","Hinay nga tangtanga ang singsing, relo ug luag nga sinina duol sa paso sa dili pa kini mohubag. Pabilina ang gidikit sa panit.","Tabuni nga luag gamit ang limpyo nga panapton nga walay hinulmol o cling film.","Pasagdi nga mainit ang lawas ug bantayi ang timailhan sa shock."]},
no:{en:"Don’t use ice, toothpaste, oil or soy sauce, and don’t pop blisters.",tl:"Huwag gumamit ng yelo, toothpaste, mantika o toyo, at huwag pumutok ng paltos.",ceb:"Ayaw gamita ang yelo, toothpaste, mantika o toyo, ug ayaw buaki ang mga lupa sa paso."},
help:{en:"Call 911 if the burn is bigger than the person’s palm, on the face, hands, joints or groin, looks white or charred, or the person is a child or older adult.",tl:"Tumawag sa 911 kung mas malaki sa palad ng tao ang paso, nasa mukha, kamay, kasu-kasuan o singit, mukhang puti o sunog, o bata o matanda ang pasyente.",ceb:"Tawag sa 911 kung mas dako sa palad sa tawo ang paso, naa sa nawong, kamot, lutahan o hita, murag puti o sunog, o bata o tigulang ang pasyente."}},
wound:{s:{en:["Wash your hands or wear gloves.","Press a clean cloth on the cut for a few minutes to stop the bleeding.","Rinse with clean running water. For scrapes, gently wash out dirt.","Cover with a clean dressing or bandage and change it daily.","Watch for redness, swelling, pus or fever over the next days."],
tl:["Maghugas ng kamay o magsuot ng guwantes.","Idiin ang malinis na tela sa hiwa nang ilang minuto para tumigil ang dugo.","Banlawan ng malinis na umaagos na tubig. Sa gasgas, dahan-dahang hugasan ang dumi.","Takpan ng malinis na dressing o benda at palitan araw-araw.","Bantayan ang pamumula, pamamaga, nana o lagnat sa mga susunod na araw."],
ceb:["Hugasi ang kamot o magsuot og guwantes.","Pislita ang limpyo nga panapton sa hiwa sulod sa pipila ka minuto aron mohunong ang dugo.","Banlasi gamit ang limpyo nga nagaagos nga tubig. Sa garas, hinay nga hugasi ang hugaw.","Tabuni og limpyo nga dressing o bendahe ug ilisi matag adlaw.","Bantayi ang pagpula, paghubag, nana o hilanat sa sunod nga mga adlaw."]},
no:{en:"Don’t scrub hard or put toothpaste, coffee or leaves on the wound.",tl:"Huwag kuskusin nang madiin o lagyan ng toothpaste, kape o dahon ang sugat.",ceb:"Ayaw kuskusa pag-ayo o butangan og toothpaste, kape o dahon ang samad."},
help:{en:"Seek care if the wound is deep or gaping, came from a rusty object or an animal, won’t stop bleeding, or shows infection. Ask a health worker about a tetanus shot.",tl:"Magpatingin kung malalim o nakanganga ang sugat, galing sa kalawangin na bagay o hayop, hindi tumitigil ang dugo, o may impeksyon. Magtanong sa health worker tungkol sa bakuna sa tetano.",ceb:"Pagpatan-aw kung lawom o nangagaw ang samad, gikan sa rusty nga butang o hayop, dili mohunong ang dugo, o naay impeksyon. Pangutana sa health worker bahin sa bakuna sa tetano."}},
airway:{s:{en:["Ask “Are you choking?” If they can cough or speak, let them keep coughing.","If they can’t cough, speak or breathe, call 911 or have someone call.","Lean them forward and give 5 firm back blows between the shoulder blades.","Give 5 abdominal thrusts: stand behind them, place a fist just above the navel and pull sharply in and up.","Repeat 5 back blows and 5 thrusts until the object comes out. If they pass out, lay them down and start CPR."],
tl:["Itanong ang “Nabubulunan ka ba?” Kung nakakaubo o nakakapagsalita, hayaan siyang umubo.","Kung hindi makaubo, makapagsalita o makahinga, tumawag sa 911 o magpatawag sa kasama.","Isandal pasulong at magbigay ng 5 malakas na tapik sa likod, sa pagitan ng mga talim ng balikat.","Magbigay ng 5 abdominal thrust: tumayo sa likod, ilagay ang kamao sa ibabaw ng pusod at hilahin nang mabilis papasok at pataas.","Ulitin ang 5 tapik at 5 thrust hanggang lumabas ang bumabara. Kung mawalan ng malay, ihiga at simulan ang CPR."],
ceb:["Pangutana “Nasakal ka ba?” Kung makaubo o makasulti, pasagdi nga mag-ubo.","Kung dili makaubo, makasulti o makaginhawa, tawag sa 911 o pasugoa ang uban nga motawag.","Isandig paabante ug hatagi og 5 ka kusog nga pagtapik sa likod, taliwala sa mga abaga.","Hatagi og 5 ka abdominal thrust: tindog sa luyo, ibutang ang kamao sa ibabaw sa pusod ug pabutlaa paingon sulod ug pataas.","Balika ang 5 ka tapik ug 5 ka thrust hangtod mogawas ang nakababag. Kung mawad-an og panimuot, pahigdaa ug sugdi ang CPR."]},
no:{en:"Don’t slap the back of someone who is coughing, and don’t reach blindly into the mouth. For infants, use back blows and chest thrusts only.",tl:"Huwag tapikin ang likod ng taong umuubo, at huwag basta kapain ang bibig. Sa sanggol, tapik sa likod at pagdiin sa dibdib lamang.",ceb:"Ayaw tapika ang likod sa nag-ubo, ug ayaw basta kuhaa ang sulod sa baba. Sa masuso, tapik sa likod ug pagpislit sa dughan lang."},
help:{en:"Call 911 for any choking that doesn’t clear right away. Get checked after abdominal thrusts, even if the object came out.",tl:"Tumawag sa 911 kung hindi agad lumalabas ang bumabara. Magpasuri pagkatapos ng abdominal thrust kahit lumabas na ito.",ceb:"Tawag sa 911 kung dili dayon mogawas ang nakababag. Pasusi human sa abdominal thrust bisan mogawas na kini."}},
cpr:{s:{en:["Shout and tap the shoulders: “Are you okay?”","If there is no response and no normal breathing, call 911 or have someone call, and ask for an AED.","Place the heel of one hand on the center of the chest and your other hand on top.","Push hard and fast, at least 5 cm deep, 100–120 times a minute. Use the metronome.","Let the chest rise fully between pushes. Keep going until help or an AED arrives, or the person wakes."],
tl:["Sumigaw at tapikin ang balikat: “Okay ka lang ba?”","Kung walang tugon at hindi humihinga nang normal, tumawag sa 911 o magpatawag, at humingi ng AED.","Ilagay ang palad ng isang kamay sa gitna ng dibdib at ang kabilang kamay sa ibabaw nito.","Pumindot nang malakas at mabilis, hindi bababa sa 5 cm ang lalim, 100–120 beses kada minuto. Gamitin ang metronome.","Hayaang bumalik ang dibdib sa pagitan ng pagpindot. Ituloy hanggang dumating ang tulong o AED, o magising ang tao."],
ceb:["Singgit ug tapika ang abaga: “Okay ka ra ba?”","Kung walay tubag ug dili normal ang ginhawa, tawag sa 911 o pasugoa ang uban, ug pangayo og AED.","Ibutang ang palad sa usa ka kamot sa tunga sa dughan ug ang lain nga kamot sa ibabaw.","Pislita pag-ayo ug paspas, labing menos 5 cm ang lawom, 100–120 ka beses matag minuto. Gamita ang metronome.","Pasagdi nga mobalik ang dughan taliwala sa pagpislit. Padayon hangtod moabot ang tabang o AED, o mamata ang tawo."]},
no:{en:"Don’t stop to check the pulse again and again, and don’t give up early. Swap with someone every 2 minutes if you tire.",tl:"Huwag paulit-ulit na kapain ang pulso at huwag sumuko agad. Magpalit sa iba kada 2 minuto kung pagod na.",ceb:"Ayaw balik-balika ang pagsusi sa pulso ug ayaw sumuko dayon. Ilis sa uban matag 2 ka minuto kung gikapoy na."},
help:{en:"Call 911 first for anyone who is not responding.",tl:"Tumawag muna sa 911 para sa sinumang hindi tumutugon.",ceb:"Tawag una sa 911 alang sa bisan kinsa nga walay tubag."}},
splint:{s:{en:["Keep the person still. Don’t move the injured limb.","Control any bleeding and cover open wounds with a clean dressing. Don’t press on exposed bone.","Pad a firm support (board, folded magazine or rolled newspaper) and lay it along the limb, covering the joints above and below.","Tie it with cloth strips above and below the injury: snug, not tight.","Check fingers or toes for warmth, color and feeling. Loosen the ties if they turn blue or numb.","Keep the person warm and get them to care."],
tl:["Panatilihing hindi gumagalaw ang tao. Huwag galawin ang nasaktang bahagi.","Kontrolin ang pagdurugo at takpan ng malinis na dressing ang bukas na sugat. Huwag diinan ang nakalabas na buto.","Lagyan ng padding ang matigas na pansalag (tabla, nakatuping magasin o nakarolyong diyaryo) at ilagay sa tabi ng bahagi, sakop ang kasu-kasuan sa itaas at ibaba.","Itali ng mga piraso ng tela sa itaas at ibaba ng pinsala: sakto, hindi masyadong higpit.","Suriin ang daliri kung mainit, may kulay at may pakiramdam. Luwagan ang tali kung nangingitim o namamanhid.","Panatilihing mainit ang tao at dalhin sa gamutan."],
ceb:["Pahunonga ang tawo sa paglihok. Ayaw ipalihok ang kadaot nga bahin.","Kontrola ang pagdugo ug tabuni og limpyo nga dressing ang bukas nga samad. Ayaw pislita ang gawas nga bukog.","Butangi og padding ang gahi nga splint (tabla, gipilo nga magasin o gilukot nga diyaryo) ug ibutang sa daplin sa bahin, lakip ang lutahan sa ibabaw ug ubos.","Higti gamit ang mga tipik sa panapton sa ibabaw ug ubos sa kadaot: saktong higpit, dili sobra.","Susiha ang mga tudlo kung mainit, naay kolor ug pamati. Luagi ang higot kung mangitom o mamanhid.","Pabilina nga mainit ang tawo ug dad-a sa pagtambal."]},
no:{en:"Don’t straighten a bent limb or push bone back in, and don’t let the person walk on a suspected broken leg.",tl:"Huwag ituwid ang baluktot na bahagi o ibalik ang buto, at huwag papaglakarin sa pinaghihinalaang baling binti.",ceb:"Ayaw tul-ira ang baluktot nga bahin o ibalik ang bukog, ug ayaw paglakwa ang tawo kung gidudahang nabali ang tiil."},
help:{en:"Call 911 for suspected injury to the head, neck, back or thigh, an open fracture, or fingers or toes that stay blue or numb.",tl:"Tumawag sa 911 kung may hinihinalang pinsala sa ulo, leeg, likod o hita, bukas na bali, o daliring nananatiling nangingitim o manhid.",ceb:"Tawag sa 911 kung gidudahang kadaot sa ulo, liog, likod o paa, bukas nga bali, o mga tudlo nga magpabilin nga mangitom o manhid."}},
heat:{s:{en:["Heat illness: move the person to shade, loosen clothing and fan them.","Cool with wet cloths or a cool shower, focusing on the neck, armpits and groin. Give sips of cool water if fully awake.","Animal bite: wash with soap and running water for 15 minutes, cover with a clean cloth, and go to an animal bite center the same day.","Insect or marine sting: remove stingers or spines, rinse with clean water (vinegar for jellyfish if available) and soak in hot, not scalding, water for pain.","Watch the person for 30 minutes for swelling, rash or trouble breathing."],
tl:["Sa heat illness: ilipat ang tao sa lilim, luwagan ang damit at paypayan.","Palamigin ng basang tela o malamig na ligo, lalo na sa leeg, kili-kili at singit. Painumin ng malamig na tubig nang paunti-unti kung gising na gising.","Kagat ng hayop: hugasan ng sabon at umaagos na tubig sa loob ng 15 minuto, takpan ng malinis na tela, at pumunta sa animal bite center sa araw ding iyon.","Tusok ng insekto o lamang-dagat: alisin ang tinik o stinger, banlawan ng malinis na tubig (suka para sa dikya kung mayroon) at ibabad sa mainit, hindi nakakapaso, na tubig para sa sakit.","Bantayan ang tao sa loob ng 30 minuto para sa pamamaga, pantal o hirap sa paghinga."],
ceb:["Sakit sa kainit: dad-a ang tawo sa landong, luagi ang sinina ug pahangina.","Palugnawa gamit ang basa nga panapton o bugnaw nga ligo, labi na sa liog, apohan ug singit. Painoma og bugnaw nga tubig kung hingpit nga mata.","Paak sa hayop: hugasi og sabon ug nagaagos nga tubig sulod sa 15 ka minuto, tabuni og limpyo nga panapton, ug adto sa animal bite center sa samang adlaw.","Tusok sa insekto o mananap sa dagat: kuhaa ang tunok o stinger, banlasi og limpyo nga tubig (suka para sa dikya kung naa) ug unaa sa init, dili makapaso, nga tubig alang sa sakit.","Bantayi ang tawo sulod sa 30 ka minuto alang sa paghubag, pantal o lisud nga ginhawa."]},
no:{en:"Don’t cut a bite, suck out venom, tie a tight band, or rub a jellyfish sting.",tl:"Huwag hiwain ang kagat, sipsipin ang lason, magtali nang mahigpit, o kuskusin ang tusok ng dikya.",ceb:"Ayaw hiwaa ang paak, sipsipa ang hilo, higta og higpit, o kuskusa ang tusok sa dikya."},
help:{en:"Call 911 for confusion, fainting, hot dry skin, trouble breathing, swelling of the face or throat, or a bite from a snake or unknown animal.",tl:"Tumawag sa 911 kung nalilito, nahihimatay, mainit at tuyo ang balat, hirap huminga, namamaga ang mukha o lalamunan, o kagat ng ahas o hindi kilalang hayop.",ceb:"Tawag sa 911 kung naglibog, nawad-an og panimuot, init ug uga ang panit, lisud ginhawa, hubag ang nawong o tutonlan, o paak sa halas o wala mailhing hayop."}}};

lP:"Purpose",lPD:"AgapAI is a first-aid companion. You upload a photo of the situation, add optional audio capture, and it shows the matching first-aid procedure and a handover summary while you wait for emergency responders.",lS:"Safety rules",lSL:["Make sure the scene is safe for you first.","Call 911 for any serious or life-threatening emergency. Do not wait for the app.","Do not move a person with a suspected head, neck or spine injury unless they are in danger.","Do not give medicine, food or drink unless a step says so.","Stop and call 911 if the person gets worse."],lL:"Legal disclosures",lLL:["AgapAI is not a medical device and does not diagnose.","It is not a substitute for professional medical care or a certified first-aid course.","AI analysis of photos and voice can be wrong. Always use your own judgment.","Photos, audio captures and history stay on your device in this prototype."],lM:"System permissions",lML:["<b>Camera:</b> take a photo of the injury or scene.","<b>Microphone:</b> only while you press and hold to record audio.","<b>Photos / Gallery:</b> choose an existing photo as evidence.","<b>Location:</b> share your position and address during emergency handover.","<b>Messages (SMS):</b> send the offline EMS/SMS telemetry dispatch."],

lP:"Layunin",lPD:"Ang AgapAI ay kasama sa first aid. Mag-upload ng larawan ng sitwasyon, magdagdag ng pagkuha ng audio kung nais, at ipapakita nito ang angkop na first aid at buod ng handover habang hinihintay ang mga responder.",lS:"Mga patakaran sa kaligtasan",lSL:["Tiyaking ligtas muna ang paligid para sa inyo.","Tumawag sa 911 sa anumang malubha o nakamamatay na emergency. Huwag hintayin ang app.","Huwag galawin ang taong may hinihinalang pinsala sa ulo, leeg o gulugod maliban kung nasa panganib.","Huwag magbigay ng gamot, pagkain o inumin maliban kung sinasabi ng hakbang.","Huminto at tumawag sa 911 kung lumalala ang tao."],lL:"Mga legal na paunawa",lLL:["Hindi medical device ang AgapAI at hindi ito nagdi-diagnose.","Hindi ito kapalit ng propesyonal na pangangalagang medikal o sertipikadong kurso sa first aid.","Maaaring mali ang AI sa pagsusuri ng larawan at boses. Laging gamitin ang sariling pagpapasya.","Nananatili sa inyong device ang mga larawan, audio at kasaysayan sa prototype na ito."],lM:"Mga pahintulot ng sistema",lML:["<b>Camera:</b> kumuha ng larawan ng sugat o pinangyarihan.","<b>Mikropono:</b> habang pinipindot at hinahawakan lamang para mag-record ng audio.","<b>Mga Larawan / Gallery:</b> pumili ng umiiral na larawan bilang ebidensya.","<b>Lokasyon:</b> ibahagi ang posisyon at address sa emergency handover.","<b>Mga Mensahe (SMS):</b> ipadala ang offline na EMS/SMS telemetry."],

cpr:{tl:["Tiyaking ligtas ang paligid|Tingnan kung tumutugon ang tao: tapikin ang balikat at sumigaw|Buksan ang daanan ng hangin: ihilig pabalik ang ulo, itaas ang baba|Suriin ang paghinga hanggang 10 segundo. Kung hindi normal, simulan ang CPR|Tumawag sa 911 o magpatawag sa iba, at kumuha ng AED|Magbigay ng 30 pindot sa dibdib: gitna ng dibdib, 5–6 cm ang lalim, 100–120 kada minuto|Saka magbigay ng 2 hinga|Ikabit ang AED pagdating nito at sundin ang mga tagubilin|Ituloy ang CPR (30:2) hanggang dumating ang tulong o gumaling ang tao|Kung normal na ang paghinga, ihiga sa recovery position|Kung gising, panatilihing mainit at bantayan hanggang dumating ang tulong","Tiyaking ligtas ang paligid|Tingnan kung tumutugon ang bata|Buksan ang daanan ng hangin|Kung hindi humihinga, simulan ang CPR at tumawag sa 911|Magbigay ng 30 pindot sa dibdib gamit ang isa o dalawang kamay, mga one-third ng lalim ng dibdib|Saka magbigay ng 2 hinga|Ikabit ang AED na may pediatric pads kung mayroon|Ituloy ang CPR (30:2)|Kung normal na ang paghinga, ihiga sa recovery position|Kung gising, panatilihing mainit at bantayan","Tiyaking ligtas ang paligid|Tingnan kung tumutugon ang sanggol: tapikin ang paa at tawagin|Linisin ang daanan ng hangin; panatilihing tuwid ang ulo|Kung hindi humihinga, simulan ang CPR at tumawag sa 911|Magbigay ng 30 pindot gamit ang dalawang daliri sa ibabang kalahati ng breastbone, mga 4 cm ang lalim|Takpan ang bibig at ilong ng sanggol at magbigay ng 2 mahinang hinga|Ikabit ang AED na may infant pads kung mayroon|Ituloy ang CPR (30:2)|Kung normal na ang paghinga, kargahin sa recovery position|Kung gising, panatilihing mainit at bantayan","Panganib: tiyaking ligtas ang lugar|Tugon: tapikin at sumigaw|Humingi ng tulong: tumawag sa 911|Daanan ng hangin: buksan at linisin|Paghinga: tingnan, pakinggan at damhin hanggang 10 segundo|CPR: 30 pindot, saka 2 hinga|Defibrillation: ikabit ang AED at sundin ang tagubilin"],
ceb:["Siguroha nga luwas ang palibot|Susiha kung motubag ang tawo: tapika ang abaga ug singgit|Ablihi ang agianan sa hangin: ipabalik ang ulo, ipataas ang suwang|Susiha ang ginhawa hangtod 10 segundo. Kung dili normal, sugdi ang CPR|Tawag sa 911 o pasugoa ang uban, ug pagkuha og AED|Hatagi og 30 ka pislit sa dughan: tunga sa dughan, 5–6 cm ang lawom, 100–120 matag minuto|Unya hatagi og 2 ka ginhawa|Ikabit ang AED inig abot ug sunda ang mga instruksyon|Padayon sa CPR (30:2) hangtod moabot ang tabang o maayo ang tawo|Kung normal na ang ginhawa, pahigdaa sa recovery position|Kung mata, pabilina nga mainit ug bantayi hangtod moabot ang tabang","Siguroha nga luwas ang palibot|Susiha kung motubag ang bata|Ablihi ang agianan sa hangin|Kung dili makaginhawa, sugdi ang CPR ug tawag sa 911|Hatagi og 30 ka pislit sa dughan gamit ang usa o duha ka kamot, mga one-third sa lawom sa dughan|Unya hatagi og 2 ka ginhawa|Ikabit ang AED nga naay pediatric pads kung naa|Padayon sa CPR (30:2)|Kung normal na ang ginhawa, pahigdaa sa recovery position|Kung mata, pabilina nga mainit ug bantayi","Siguroha nga luwas ang palibot|Susiha kung motubag ang masuso: tapika ang tiil ug tawga|Limpyohi ang agianan sa hangin; ipabilin nga tul-id ang ulo|Kung dili makaginhawa, sugdi ang CPR ug tawag sa 911|Hatagi og 30 ka pislit gamit ang duha ka tudlo sa ubos nga katunga sa breastbone, mga 4 cm ang lawom|Tabuni ang baba ug ilong sa masuso ug hatagi og 2 ka hinay nga ginhawa|Ikabit ang AED nga naay infant pads kung naa|Padayon sa CPR (30:2)|Kung normal na ang ginhawa, gunita sa recovery position|Kung mata, pabilina nga mainit ug bantayi","Peligro: siguroha nga luwas ang lugar|Tubag: tapika ug singgit|Pagpangayo og tabang: tawag sa 911|Agianan sa hangin: ablihi ug limpyohi|Ginhawa: tan-awa, paminaw ug gibati hangtod 10 segundo|CPR: 30 ka pislit, unya 2 ka ginhawa|Defibrillation: ikabit ang AED ug sunda ang instruksyon"]},
poisons:{tl:"Tiyaking ligtas ang lugar at itigil ang karagdagang exposure|Tumawag agad sa 911|Alamin kung ano, gaano karami at kailan; itabi ang lalagyan|Huwag magpasuka maliban kung sinabi ng propesyonal|Balat o mata: banlawan ng umaagos na tubig sa loob ng 15 minuto|Kung hindi tumutugon pero humihinga, ihiga sa recovery position; kung hindi humihinga, simulan ang CPR",ceb:"Siguroha nga luwas ang lugar ug undanga ang dugang nga exposure|Tawag dayon sa 911|Ilha kung unsa, unsa kadaghan ug kanus-a; tipigi ang sudlanan|Ayaw pagpa-ula gawas kung giingon sa propesyonal|Panit o mata: banlasi og nagaagos nga tubig sulod sa 15 ka minuto|Kung walay tubag apan nagginhawa, ibutang sa recovery position; kung dili makaginhawa, sugdi ang CPR"},
allergic:{tl:"Ilayo ang tao sa pinagmulan ng reaksyon|Lagyan ng cold pack ang namamaga o makating bahagi|Bantayan ang paghinga at pamamaga nang hindi bababa sa 30 minuto|Kung nahihirapang huminga o namamaga ang mukha o lalamunan, tumawag agad sa 911|Huwag magbigay ng gamot; sabihin sa responder kung ano ang nakasalamuha",ceb:"Ilayo ang tawo sa hinungdan|Butangi og cold pack ang hubag o makatol nga bahin|Bantayi ang ginhawa ug paghubag labing menos 30 ka minuto|Kung lisud ang ginhawa o hubag ang nawong o tutonlan, tawag dayon sa 911|Ayaw hatagi og tambal; sultihi ang responder kung unsay naapektohan"},
asthma:{tl:"Paupuin nang tuwid ang tao at pakalmahin|Luwagan ang masikip na damit at ilayo sa usok, alikabok o iba pang trigger|Himukin ang mabagal at tuloy-tuloy na paghinga|Tumawag sa 911 kung hirap huminga, nangingitim ang labi, o hindi gumagaling|Samahan hanggang dumating ang tulong",ceb:"Paalsa ang tawo ug pahulayon|Luagi ang hugot nga sinina ug ilayo sa aso, abog o uban pang hinungdan|Awhaga ang hinay ug padayon nga ginhawa|Tawag sa 911 kung lisud ang ginhawa, mangitom ang ngabil, o wala mag-ayo|Pabilin hangtod moabot ang tabang"},
anaphylaxis:{tl:"Tumawag agad sa 911|Alisin ang pinagmulan kung kaya (halimbawa, ang stinger)|Ihiga nang patag at itaas ang mga binti (paupuin kung hirap huminga)|Huwag hayaang tumayo o maglakad|Bantayan ang paghinga; simulan ang CPR kung huminto|Huwag magbigay ng gamot; sabihin sa responder ang nangyari",ceb:"Tawag dayon sa 911|Kuhaa ang hinungdan kung mahimo (pananglitan, ang stinger)|Pahigdaa nga patag ug itaas ang mga tiil (paalsa kung lisud ang ginhawa)|Ayaw pagtindoga o paglakwa|Bantayi ang ginhawa; sugdi ang CPR kung mohunong|Ayaw hatagi og tambal; sultihi ang responder sa nahitabo"},
diabetics:{tl:["Ihinto ang ehersisyo at magpahinga, pakalmahin ang pasyente|Gamitin ang glucose monitor (glucometer)|Bigyan ng asukal kung gising at kayang lumunok|Dapat bumuti sa loob ng 15 minuto|Kapag bumuti na, bigyan ng carbohydrate na mas matagal ang bisa|Kung hindi bumuti at nagka-seizure o walang malay, tumawag sa 911|Bantayan ang vital signs|Sabihin sa responder kung gumagamit ng insulin","Gamitin ang glucose monitor (glucometer)|Hayaang inumin ng tao ang sarili niyang reseta; huwag magbigay ng gamot|Himukin ang pasyenteng uminom ng tubig|Humingi ng tulong medikal"],ceb:["Undangi ang ehersisyo ug pahulay, pahusay ang pasyente|Gamita ang glucose monitor (glucometer)|Hatagi og asukal kung mata ug makalunok|Angay moayo sulod sa 15 ka minuto|Kung maayo na, hatagi og carbohydrate nga mas dugay ang epekto|Kung wala moayo ug nag-seizure o walay panimuot, tawag sa 911|Bantayi ang vital signs|Sultihi ang responder kung migamit og insulin","Gamita ang glucose monitor (glucometer)|Pasagdi ang tawo nga mag-inom sa iyang reseta; ayaw hatagi og tambal|Awhaga ang pasyente nga moinom og tubig|Pagpangayo og medikal nga tabang"]},
overdose:{tl:"Tiyaking ligtas at tumawag sa 911|Tingnan ang tugon at paghinga|Kung hindi tumutugon at hindi humihinga, simulan ang CPR|Kung humihinga, ihiga sa recovery position|Itabi ang mga lalagyan o sangkap para ipakita sa responder|Samahan hanggang dumating ang tulong; huwag magbigay ng pagkain o inumin o magpasuka",ceb:"Siguroha nga luwas ug tawag sa 911|Susiha ang tubag ug ginhawa|Kung walay tubag ug dili makaginhawa, sugdi ang CPR|Kung nagginhawa, ibutang sa recovery position|Tipigi ang mga sudlanan o butang aron ipakita sa responder|Pabilin hangtod moabot ang tabang; ayaw hatagi og pagkaon o ilimnon o pagpa-ula"},
eye:{tl:["Huwag kuskusin ang mata|Maghugas ng kamay|Banlawan ng malinis na tubig o saline|Kung nakabaon, huwag alisin; takpan nang maluwag ang magkabilang mata|Humingi ng tulong medikal","Huwag alisin ang bagay|Suportahan ng may padding na dressing o paper cup|Takpan ang magkabilang mata para hindi gumalaw|Panatilihing hindi gumagalaw ang tao at tumawag sa 911","Huwag diinan|Takpan nang maluwag ng sterile na dressing|Humingi ng tulong medikal","Banlawan ng malinis na umaagos na tubig nang hindi bababa sa 15 minuto, nakabukas ang talukap|Alisin ang contact lens|Takpan nang maluwag ng malinis na dressing|Tumawag sa 911 o magpatingin agad","Lumipat sa sariwang hangin|Banlawan ng malinis na tubig ang mga mata|Huwag kuskusin|Humingi ng tulong kung hindi nawawala ang sakit o pagbabago sa paningin","Huwag itulak pabalik|Takpan nang maluwag ng basang sterile na dressing at protektahan ng tasa|Takpan ang kabilang mata|Tumawag sa 911 at panatilihing nakahiga at hindi gumagalaw"],ceb:["Ayaw kuskusa ang mata|Hugasi ang kamot|Banlasi og limpyo nga tubig o saline|Kung nakabaon, ayaw kuhaa; tabuni nga luag ang duha ka mata|Pagpangayo og medikal nga tabang","Ayaw kuhaa ang butang|Suportahi og dressing nga naay padding o paper cup|Tabuni ang duha ka mata aron dili molihok|Pabilina nga dili molihok ang tawo ug tawag sa 911","Ayaw pislita|Tabuni nga luag og sterile nga dressing|Pagpangayo og medikal nga tabang","Banlasi og limpyo nga nagaagos nga tubig labing menos 15 ka minuto, abli ang mga pilok|Tangtanga ang contact lens|Tabuni nga luag og limpyo nga dressing|Tawag sa 911 o pagpatan-aw dayon","Lakaw sa presko nga hangin|Banlasi og limpyo nga tubig ang mga mata|Ayaw kuskusa|Pagpangayo og tabang kung dili mawala ang sakit o kausaban sa panan-aw","Ayaw ipasulod balik|Tabuni nga luag og basa nga sterile nga dressing ug panalipdi og tasa|Tabuni ang laing mata|Tawag sa 911 ug pabilina nga nakahigda ug dili molihok"]},
electric:{tl:"Huwag hawakan ang tao hangga't hindi patay ang kuryente|Patayin ang kuryente o ilayo ang pinagmulan gamit ang tuyo at hindi-konduktibong bagay|Tumawag sa 911|Suriin ang paghinga; simulan ang CPR kung kailangan|Palamigin ng umaagos na tubig ang anumang paso at takpan|Panatilihing mainit ang tao; kailangang masuri ng doktor ang lahat ng nakuryente",ceb:"Ayaw hilabti ang tawo hangtod nga napalong ang kuryente|Palonga ang kuryente o ilayo ang gigikanan gamit ang uga nga butang nga dili makakonduktor|Tawag sa 911|Susiha ang ginhawa; sugdi ang CPR kung gikinahanglan|Palugnawa og nagaagos nga tubig ang bisan unsang paso ug tabuni|Pabilina nga mainit ang tawo; ang tanan nga nakuryente kinahanglang masusi sa doktor"},
frostbite:{tl:"Lumipat sa mainit na lugar; alisin ang basang damit at alahas|Dahan-dahang initin sa maligamgam (hindi mainit) na tubig, 37–39°C, sa loob ng 15–30 minuto|Huwag kuskusin o gumamit ng direktang init|Takpan nang maluwag ng tuyong sterile na dressing; paghiwalayin ang mga daliri|Humingi ng tulong medikal",ceb:"Lakaw sa mainit nga lugar; tangtanga ang basa nga sinina ug alahas|Hinay nga painita sa maligamgam (dili init) nga tubig, 37–39°C, sulod sa 15–30 ka minuto|Ayaw kuskusa o paggamit og direktang kainit|Tabuni nga luag og uga nga sterile nga dressing; ilahi ang mga tudlo|Pagpangayo og medikal nga tabang"},
head:{tl:"Panatilihing hindi gumagalaw ang tao at suportahan ang ulo at leeg|Kontrolin ang dugo sa banayad na pagdiin; huwag diinan ang lubog sa bungo|Maglagay ng cold pack|Bantayan kung inaantok, nagsusuka o nalilito|Tumawag sa 911 kung walang malay, nagka-seizure, o may lumalabas na likido sa tainga o ilong",ceb:"Pabilina nga dili molihok ang tawo ug suportahi ang ulo ug liog|Kontrola ang dugo pinaagi sa hinay nga pagpislit; ayaw pislita ang lungib sa bungo|Butangi og cold pack|Bantayi kung naluya, nagsuka o naglibog|Tawag sa 911 kung walay panimuot, nag-seizure, o naay likido nga mogawas sa dalunggan o ilong"},
heart:{tl:"Ihinto ang ginagawa, paupuin at pakalmahin ang tao|Tumawag agad sa 911|Luwagan ang masikip na damit|Huwag magbigay ng pagkain, inumin o gamot|Bantayan ang pagtugon at paghinga|Kung hindi tumutugon at hindi humihinga, simulan ang CPR at gumamit ng AED",ceb:"Undangi ang gibuhat, paalsa ug pahusaya ang tawo|Tawag dayon sa 911|Luagi ang hugot nga sinina|Ayaw hatagi og pagkaon, ilimnon o tambal|Bantayi ang tubag ug ginhawa|Kung walay tubag ug dili makaginhawa, sugdi ang CPR ug gamita ang AED"},
nosebleed:{tl:"Umupo at yumuko pasulong|Kurutin ang malambot na bahagi ng ilong sa loob ng 10 minuto|Huminga sa bibig|Maglagay ng cold pack sa tulay ng ilong|Huwag ihilig pabalik ang ulo o lagyan ng bagay ang ilong|Humingi ng tulong kung lampas 20 minuto ang pagdurugo o kasunod ng pinsala sa ulo",ceb:"Lingkod ug yuko paabante|Kurti ang humok nga bahin sa ilong sulod sa 10 ka minuto|Ginhawa pinaagi sa baba|Butangi og cold pack ang tulay sa ilong|Ayaw ihigda paatras ang ulo o butangan og butang ang ilong|Pagpangayo og tabang kung molapas og 20 ka minuto ang pagdugo o human sa kadaot sa ulo"},
seizure:{tl:"Alisin ang mga panganib at itala ang oras|Protektahan ang ulo ng malambot na bagay|Huwag pigilan o lagyan ng anuman ang bibig|Luwagan ang masikip na damit|Kapag tumigil, suriin ang paghinga at ihiga sa recovery position|Tumawag sa 911 kung lampas 5 minuto, paulit-ulit, o unang seizure",ceb:"Kuhaa ang mga peligro ug isulat ang oras|Panalipdi ang ulo gamit ang humok nga butang|Ayaw pugngi o butangan og bisan unsa ang baba|Luagi ang hugot nga sinina|Inig undang, susiha ang ginhawa ug ibutang sa recovery position|Tawag sa 911 kung molapas og 5 ka minuto, balik-balik, o unang seizure"},
shock:{tl:"Tumawag sa 911|Gamutin ang sanhi (hal. kontrolin ang pagdurugo)|Ihiga nang patag at itaas ang mga binti maliban kung may pinsala|Luwagan ang masikip na damit at panatilihing mainit|Huwag magbigay ng pagkain o inumin|Bantayan ang paghinga at pagtugon",ceb:"Tawag sa 911|Tambali ang hinungdan (pananglitan, kontrola ang pagdugo)|Pahigdaa nga patag ug itaas ang mga tiil gawas kung naay kadaot|Luagi ang hugot nga sinina ug pabilina nga mainit|Ayaw hatagi og pagkaon o ilimnon|Bantayi ang ginhawa ug tubag"},
spinal:{tl:"Panatilihing hindi gumagalaw ang tao; huwag ilipat maliban kung may agarang panganib|Tumawag sa 911|Suportahan ang ulo at leeg sa posisyong nakita|Sabihan ang tao na huwag gumalaw|Bantayan ang paghinga; gumamit ng jaw thrust kung kailangang buksan ang daanan ng hangin|Kung kailangang ilipat, i-log-roll nang may kasama",ceb:"Pabilina nga dili molihok ang tawo; ayaw ibalhin gawas kung naay dinalian nga peligro|Tawag sa 911|Suportahi ang ulo ug liog sa posisyon nga nakita|Sultihi ang tawo nga ayaw paglihok|Bantayi ang ginhawa; gamita ang jaw thrust kung kinahanglan ablihon ang agianan sa hangin|Kung kinahanglang ibalhin, i-log-roll uban og tabang"},
sprains:{tl:"Pahingahin ang nasaktang bahagi|Maglagay ng nakabalot na cold pack sa loob ng 15–20 minuto kada 2 oras|Bendahan ng elastic bandage, hindi masyadong mahigpit|Itaas nang mas mataas sa puso|Humingi ng tulong kung hindi makatayo ang tao o mukhang nabaluktot ang bahagi",ceb:"Pahulaya ang nasamdan nga bahin|Butangi og giputos nga cold pack sulod sa 15–20 ka minuto matag 2 ka oras|Bendahi og elastic bandage, dili sobra ka higpit|Itaas labaw sa kasingkasing|Pagpangayo og tabang kung dili makatindog ang tawo o murag nabaluktot ang bahin"},
stroke:{tl:"Gamitin ang FAST: Face na nakalaylay, Arm na mahina, Speech na hirap, Time para tumawag sa 911|Itala ang oras ng simula ng sintomas|Pakalmahin ang tao, nakahiga o nakaupo na bahagyang nakataas ang ulo|Huwag magbigay ng pagkain, inumin o gamot|Kung hindi tumutugon pero humihinga, ihiga sa recovery position",ceb:"Gamita ang FAST: Face nga nahulog, Arm nga luya, Speech nga lisud, Time aron motawag sa 911|Isulat ang oras sa pagsugod sa sintomas|Pahusaya ang tawo, nakahigda o nakalingkod nga gamay nga taas ang ulo|Ayaw hatagi og pagkaon, ilimnon o tambal|Kung walay tubag apan nagginhawa, ibutang sa recovery position"},
tick:{tl:"Gumamit ng pinong-dulong tweezers malapit sa balat|Hilahin pataas nang tuloy-tuloy; huwag pilipitin o durugin ang garapata|Linisin ang bahagi ng sabon at tubig|Itabi ang garapata para makilala|Magpatingin kung may pantal, lagnat, o naiwan ang ulo sa balat",ceb:"Gamita ang pino ang tumoy nga tweezers duol sa panit|Bira paitaas nga padayon; ayaw usba o dugmoka ang garapata|Limpyohi ang bahin og sabon ug tubig|Tipigi ang garapata aron mailhan|Pagpatan-aw kung naay pantal, hilanat, o nabilin ang ulo sa panit"},
assess:{tl:"Tiyaking ligtas ang paligid|Tingnan kung tumutugon ang tao|Tumawag sa 911 kung malubha ang pinsala|Suriin ang daanan ng hangin, paghinga at sirkulasyon|Kontrolin ang matinding pagdurugo|Suriin mula ulo hanggang paa para sa iba pang pinsala|Panatilihing mainit ang tao at bantayan",ceb:"Siguroha nga luwas ang palibot|Susiha kung motubag ang tawo|Tawag sa 911 kung grabe ang kadaot|Susiha ang agianan sa hangin, ginhawa ug sirkulasyon|Kontrola ang grabe nga pagdugo|Susiha gikan ulo hangtod tiil alang sa uban pang kadaot|Pabilina nga mainit ang tawo ug bantayi"},
recovery:{tl:"Lumuhod sa tabi ng tao; ilagay ang pinakamalapit na braso nang pa-right angle|Ilapat ang kabilang braso sa dibdib, nakadikit ang kamay sa pisngi|Itiklop pataas ang kabilang tuhod|Dahan-dahang ipagulong ang tao palapit sa inyo|Ihilig pabalik ang ulo para bukas ang daanan ng hangin|Bantayan ang paghinga hanggang dumating ang tulong",ceb:"Lumhod tupad sa tawo; ibutang ang labing duol nga bukton nga pa-right angle|Ibutang ang laing bukton sa dughan, nagdapat ang kamot sa aping|Ipatiyuk pataas ang laing tuhod|Hinay nga ipagulong ang tawo padulong nimo|Ipabalik ang ulo aron abli ang agianan sa hangin|Bantayi ang ginhawa hangtod moabot ang tabang"}};

ld pack, bendahe at itaas ang bahagi.",ceb:"Pahulay, cold pack, bendahe ug itaas ang bahin."},stroke:{tl:"Kilalanin ang senyales gamit ang FAST at tumawag agad sa 911.",ceb:"Ilha ang timailhan gamit ang FAST ug tawag dayon sa 911."},tick:{tl:"Ligtas na tanggalin ang garapata gamit ang tweezers.",ceb:"Luwas nga kuhaa ang garapata gamit ang tweezers."},assess:{tl:"Suriin nang hakbang-hakbang ang panganib, tugon, daanan ng hangin at paghinga.",ceb:"Susiha lakang-lakang ang peligro, tubag, agianan sa hangin ug ginhawa."},recovery:{tl:"Ihiga nang nakatagilid ang humihinga ngunit hindi tumutugong tao.",ceb:"Pahigdaa nga nakasiding ang nagginhawa apan walay tubag nga tawo."},spinal:{tl:"Panatilihing hindi gumagalaw at suportahan ang ulo at leeg.",ceb:"Pabilina nga dili molihok ug suportahi ang ulo ug liog."}};

const KB=[
[/cpr|unconscious|not breathing|cardiac|heart attack|walang malay|hindi humihinga|walay panimuot|wala’y panimuot|dili makaginhawa|dili maginhawa/,'cpr',0,{en:"Call 911 now and ask for an AED. If the person is unresponsive and not breathing normally, start hands-only CPR: push hard and fast on the center of the chest, 5–6 cm deep, 100–120 times a minute, until help arrives.",tl:"Tumawag agad sa 911 at humingi ng AED. Kung hindi tumutugon at hindi humihinga nang normal ang tao, simulan ang hands-only CPR: pumindot nang malakas at mabilis sa gitna ng dibdib, 5–6 cm ang lalim, 100–120 beses kada minuto, hanggang dumating ang tulong.",ceb:"Tawag dayon sa 911 ug pangayo og AED. Kung walay tubag ug dili normal ang ginhawa sa tawo, sugdi ang hands-only CPR: pislita pag-ayo ug paspas ang tunga sa dughan, 5–6 cm ang lawom, 100–120 ka beses matag minuto, hangtod moabot ang tabang."}],
[/chok|heimlich|nabulunan|nasakal|nabara|barado/,'choking',0,{en:"If they can’t cough, speak or breathe: call 911, give 5 firm back blows between the shoulder blades, then 5 abdominal thrusts. Repeat until the object clears. For infants, use back blows and chest thrusts only.",tl:"Kung hindi makaubo, makapagsalita o makahinga: tumawag sa 911, magbigay ng 5 malakas na tapik sa likod sa pagitan ng mga talim ng balikat, saka 5 abdominal thrust. Ulitin hanggang lumabas ang bumabara. Sa sanggol, tapik sa likod at pagdiin sa dibdib lamang.",ceb:"Kung dili makaubo, makasulti o makaginhawa: tawag sa 911, hatagi og 5 ka kusog nga tapik sa likod taliwala sa mga abaga, unya 5 ka abdominal thrust. Balika hangtod mogawas ang nakababag. Sa masuso, tapik sa likod ug pagpislit sa dughan lang."}],
[/seiz|stroke|kombuls|kumbuls|sumpong|epilep|nanginginig/,'seizure',0,{en:"Call 911. For a seizure: clear hazards, protect the head with something soft, don’t restrain or put anything in the mouth, and note the time. For a stroke, use FAST (Face, Arm, Speech, Time) and note when symptoms began.",tl:"Tumawag sa 911. Sa seizure: alisin ang panganib, protektahan ang ulo ng malambot na bagay, huwag pigilan o lagyan ng anuman ang bibig, at itala ang oras. Sa stroke, gamitin ang FAST (Mukha, Braso, Pagsasalita, Oras) at itala kung kailan nagsimula.",ceb:"Tawag sa 911. Sa seizure: kuhaa ang peligro, panalipdi ang ulo gamit ang humok nga butang, ayaw pugngi o butangan ang baba, ug isulat ang oras. Sa stroke, gamita ang FAST (Nawong, Bukton, Pagsulti, Oras) ug isulat kung kanus-a nagsugod."}],
[/bleed|blood|dugo|pagdurugo|pagdugo|hemorr|nagdurugo|nagdugo/,'bleeding',1,{en:"Press firmly on the wound with a clean cloth and don’t lift it. If blood soaks through, add more cloth on top. Raise the limb if no fracture is suspected. Call 911 if blood spurts or doesn’t slow after 10 minutes.",tl:"Idiin nang mahigpit sa sugat ang malinis na tela at huwag itong alisin. Kung nababasa ng dugo, dagdagan ng tela sa ibabaw. Itaas ang bahagi kung walang hinihinalang bali. Tumawag sa 911 kung bumubulwak ang dugo o hindi bumabagal pagkalipas ng 10 minuto.",ceb:"Pislita pag-ayo ang samad gamit ang limpyo nga panapton ug ayaw kini ibton. Kung nabasa sa dugo, dugangi og panapton sa ibabaw. Itaas ang bahin kung walay gidudahang bali. Tawag sa 911 kung nagsirit ang dugo o wala mohinay human sa 10 ka minuto."}],
[/burn|scald|tambutso|paso|exhaust|sunog/,'burns',1,{en:"Move away from the heat and cool the burn under clean running water for 20 minutes. Remove rings and loose clothing nearby, but leave anything stuck to the skin. Cover loosely with clean cloth. No ice, toothpaste or oil, and don’t pop blisters.",tl:"Lumayo sa init at palamigin ang paso sa malinis na umaagos na tubig sa loob ng 20 minuto. Alisin ang singsing at maluwag na damit sa paligid, pero iwan ang anumang dumikit sa balat. Takpan nang maluwag ng malinis na tela. Bawal ang yelo, toothpaste o mantika, at huwag pumutok ng paltos.",ceb:"Pahawa sa kainit ug palugnawa ang paso sa limpyo nga nagaagos nga tubig sulod sa 20 ka minuto. Tangtanga ang singsing ug luag nga sinina sa duol, apan pabilina ang gidikit sa panit. Tabuni nga luag og limpyo nga panapton. Ayaw gamita ang yelo, toothpaste o mantika, ug ayaw buaki ang lupa."}],
[/bone|fractur|splint|broke|buto|bukog|bali|nabali|sprain/,'fractures',1,{en:"Keep the limb still in the position found. Cover open wounds with a clean dressing, pad a firm support (board, rolled magazine) and tie it above and below the injury, snug but not tight. Check fingers or toes stay warm. Call 911 for head, neck, back, thigh or open fractures.",tl:"Panatilihing hindi gumagalaw ang bahagi sa posisyong nakita. Takpan ng malinis na dressing ang bukas na sugat, lagyan ng padding ang matigas na pansalag (tabla, nakarolyong magasin) at itali sa itaas at ibaba ng pinsala, sakto lang ang higpit. Tiyaking mainit ang mga daliri. Tumawag sa 911 sa pinsala sa ulo, leeg, likod, hita o bukas na bali.",ceb:"Pabilina nga dili molihok ang bahin sa posisyon nga nakita. Tabuni og limpyo nga dressing ang bukas nga samad, butangi og padding ang gahi nga splint (tabla, gilukot nga magasin) ug higti sa ibabaw ug ubos sa kadaot, saktong higpit lang. Siguroha nga init ang mga tudlo. Tawag sa 911 sa kadaot sa ulo, liog, likod, paa o bukas nga bali."}],
[/\bcut\b|wound|abrasion|scrape|sugat|samad|hiwa|gasgas|garas/,'wound',1,{en:"Wash your hands or wear gloves, press a clean cloth on the cut to stop bleeding, rinse with clean running water, then cover with a clean dressing. Watch for redness, swelling, pus or fever, and ask a health worker about a tetanus shot.",tl:"Maghugas ng kamay o magsuot ng guwantes, idiin ang malinis na tela sa hiwa para tumigil ang dugo, banlawan ng malinis na umaagos na tubig, saka takpan ng malinis na dressing. Bantayan ang pamumula, pamamaga, nana o lagnat, at magtanong sa health worker tungkol sa bakuna sa tetano.",ceb:"Hugasi ang kamot o magsuot og guwantes, pislita ang limpyo nga panapton sa hiwa aron mohunong ang dugo, banlasi og limpyo nga nagaagos nga tubig, unya tabuni og limpyo nga dressing. Bantayi ang pagpula, paghubag, nana o hilanat, ug pangutana sa health worker bahin sa bakuna sa tetano."}],
[/heat|sting|jelly|bite|kagat|paak|insect|dikya|ahas|snake|kainit|tusok|init/,'bites',1,{en:"Heat: move to shade, loosen clothing, cool with wet cloths and give sips of water if awake. Animal bite: wash with soap and running water for 15 minutes and get care the same day. Jellyfish: rinse with vinegar if available and don’t rub. Call 911 for swelling of the face or throat, trouble breathing or confusion.",tl:"Init: ilipat sa lilim, luwagan ang damit, palamigin ng basang tela at painumin ng tubig nang paunti-unti kung gising. Kagat ng hayop: hugasan ng sabon at umaagos na tubig sa loob ng 15 minuto at magpagamot sa araw ding iyon. Dikya: banlawan ng suka kung mayroon at huwag kuskusin. Tumawag sa 911 kung namamaga ang mukha o lalamunan, hirap huminga o nalilito.",ceb:"Kainit: dad-a sa landong, luagi ang sinina, palugnawa og basa nga panapton ug painoma og tubig kung mata. Paak sa hayop: hugasi og sabon ug nagaagos nga tubig sulod sa 15 ka minuto ug magpatambal sa samang adlaw. Dikya: banlasi og suka kung naa ug ayaw kuskusa. Tawag sa 911 kung hubag ang nawong o tutonlan, lisud ginhawa o naglibog."}],
[/household|substitute|cloth|malong|pamalit|ipapalit|hulip|puli|alternative/,null,1,{en:"Use what is clean and nearby: a clean shirt, towel or scarf as a pad, and a belt or cloth strips as ties. Scan the emergency and I’ll show substitutes for the place you’re in.",tl:"Gamitin ang malinis at malapit: malinis na damit, tuwalya o scarf bilang pad, at sinturon o piraso ng tela bilang tali. I-scan ang emergency at ipapakita ko ang mga pamalit para sa lugar ninyo.",ceb:"Gamita ang limpyo ug duol: limpyo nga sinina, tualya o bandana isip pad, ug bakus o tipik sa panapton isip higot. I-scan ang emergency ug ipakita nako ang mga hulip para sa imong lugar."}],
[/scan|photo|picture|kuha|litrato|larawan|hulagway/,null,1,{en:"Sure. Scan the emergency and I’ll match it to the right first-aid steps.",tl:"Sige. I-scan ang emergency at itutugma ko ito sa tamang hakbang ng first aid.",ceb:"Sige. I-scan ang emergency ug itugma nako kini sa saktong lakang sa first aid."}],
[/911|ambulance|ambulansya|emergency number/,null,0,{en:"For serious or life-threatening emergencies, call 911 right now using the yellow Call 911 button. Don’t wait for the app.",tl:"Sa malubha o nakamamatay na emergency, tumawag agad sa 911 gamit ang dilaw na Call 911 button. Huwag hintayin ang app.",ceb:"Sa grabe o makamatay nga emergency, tawag dayon sa 911 gamit ang dilaw nga Call 911 button. Ayaw paghulat sa app."}],
[/^(hi|hello|hey|helo|kumusta|kamusta|musta|maayong)/,null,0,{en:"Hello! I’m the AgapAI assistant. Tell me what happened and where the person is hurt, and I’ll guide you.",tl:"Kumusta! Ako ang AgapAI assistant. Sabihin ang nangyari at kung saan nasaktan ang tao, at gagabayan ko kayo.",ceb:"Kumusta! Ako ang AgapAI assistant. Isulti ang nahitabo ug asa nasamdan ang tawo, ug giyahan tika."}],
[/thank|salamat|maraming salamat|daghang salamat/,null,0,{en:"You’re welcome. Stay safe, and call 911 if the person gets worse.",tl:"Walang anuman. Mag-ingat, at tumawag sa 911 kung lumala ang tao.",ceb:"Walay sapayan. Pag-amping, ug tawag sa 911 kung mograbe ang tawo."}]];

      <div class="space-y-3">${row.frames.map(fr=>`<div class="card border border-[#91C4D9]/50 p-4 space-y-2.5">
        <div class="flex items-center justify-between gap-2">
          <div>
            <span class="inline-block bg-[#CEECF2] text-[#0B7ABF] font-mono text-[11px] font-extrabold px-2.5 py-0.5 rounded-full">${fr.id}</span>
            <h3 class="text-base font-extrabold text-[#0F172A] mt-1">${fr.name}</h3>
          </div>
          <button data-act="${fr.fstep!=null?'fstep':'go'}" data-k="${fr.fstep??''}" data-v="${fr.v}" class="px-3 py-1.5 rounded-full bg-[#0B7ABF] text-white text-xs font-extrabold shrink-0 active:scale-95 transition">Preview Screen ›</button>
        </div>
        <div class="bg-[#F4FBFE] border border-[#91C4D9]/30 rounded-2xl p-3 space-y-1">
          <p class="text-[10px] font-extrabold text-[#0B7ABF] uppercase">UI Elements &amp; Buttons on Screen</p>
          <ul class="text-xs font-semibold text-slate-700 space-y-1">${fr.ui.map(u=>`<li class="flex gap-1.5"><span class="text-[#0B7ABF] font-extrabold">•</span><span>${u}</span></li>`).join('')}</ul>
        </div>
        <div class="space-y-1">
          <p class="text-[10px] font-extrabold text-slate-500 uppercase">Interaction Map (On Click → Target Frame)</p>
          <div class="flex flex-wrap gap-1.5">${fr.links.map(([trig,dest,act])=>{
            const isFs=act.startsWith('fstep:');
            const fsK=isFs?act.split(':')[1]:'';
            const actName=isFs?'fstep':(['subs','call','chat'].includes(act)?act:'go');
            return `<button data-act="${actName}" ${isFs?`data-k="${fsK}"`:`data-v="${act}"`} class="text-left px-3 py-1.5 rounded-xl bg-[#CEECF2]/70 hover:bg-[#CEECF2] text-[#0F172A] text-[11px] font-bold transition flex items-center gap-1.5"><span>${trig}</span><span class="text-[#0B7ABF] font-extrabold">→ ${dest}</span></button>`;
          }).join('')}</div>
        </div>
      </div>`).join('')}</div>
    </div>`).join('')}
  </div>`;
};
function curFIdx(){
  if(S.v=='home')return 0;
  if(S.v=='cap')return 1;
  if(S.v=='tri'&&S.fin)return 8;
  if(S.v=='tri')return Math.min(7,Math.max(2,2+S.i));
  return -1;
}
function goFStep(k){
  const st=FSTEPS[k];if(!st)return;
  S.ev.mod='bleeding';if(!S.ev.scene)S.ev.scene='home';
  if(!S.cur)S.cur=SEED[1];
  S.an=false;S.v=st.v;S.fin=st.fin?1:0;
  if(st.i!=null)S.i=st.i;
  render();scrollTo(0,0);
}
function flowBar(){
  const idx=curFIdx();
  return `<div class="sticky top-8 z-30 bg-white/95 backdrop-blur border-b border-[#91C4D9]/40 px-3 py-2 space-y-1.5">
    <div class="flex items-center justify-between gap-1.5 text-[11px] font-extrabold text-[#0B7ABF]">
      <button data-act="go" data-v="${S.v=='map'?'home':'map'}" class="px-2.5 py-1 rounded-full ${S.v=='map'?'bg-[#F2B705] text-[#0F172A]':'bg-[#0F172A] text-white'} transition">${S.v=='map'?'📱 Phone View':'🗺️ 16-Frame Map'}</button>
      <div class="flex items-center gap-1">
        <button data-act="go" data-v="onb" class="px-2 py-0.5 rounded-full bg-[#CEECF2] text-[#0F172A] hover:brightness-95 transition">Onboard</button>
        <button data-act="fprev" ${idx<=0?'disabled':''} class="px-2 py-0.5 rounded-full bg-[#CEECF2] text-[#0B7ABF] disabled:opacity-40">‹ Prev</button>
        <button data-act="fnext" class="px-2 py-0.5 rounded-full bg-[#0B7ABF] text-white">${idx==FSTEPS.length-1?'Restart':'Next ›'}</button>
      </div>
    </div>
    <div class="flex gap-1.5 overflow-x-auto pb-0.5">${FSTEPS.map((s,k)=>`<button data-act="fstep" data-k="${k}" class="shrink-0 px-2.5 py-1 rounded-full text-[11px] font-bold transition ${idx==k&&S.v!='map'?'bg-[#0B7ABF] text-white shadow-sm':'bg-[#CEECF2]/70 text-[#0F172A]'}">${s.l}</button>`).join('')}</div>
  </div>`;
}
function render(){document.documentElement.classList.toggle('dark',S.dark);document.documentElement.lang={en:'en',tl:'fil',ceb:'ceb'}[S.lang];const nv=['home','aid','mod','hist','hdet','set'].includes(S.v),vc=lv!==S.v?'view':'';lv=S.v;
app.innerHTML=`${['splash','onb','learn','auth','forgot','perm'].includes(S.v)?'':sbar()}${flowBar()}<div class="${vc}">${V[S.v]()}</div>${nv?nav():''}${nv||(S.v=='tri'&&!S.fin)?fab():''}${S.chat?drawer():''}${S.modal?`<div data-act="bg" class="fixed inset-0 z-50 bg-slate-900/40 flex items-end justify-center"><div class="card rounded-b-none w-full max-w-md p-6 space-y-3">${S.modal}<button data-act="close" class="${W} w-full py-3 border border-[#91C4D9]">${T('close')}</button></div></div>`:''}`;
const m=$('msgs');if(m)m.scrollTop=m.scrollHeight}
function begin(f,src){S.ev={img:src,...detect(f)};if(S.hint){S.ev.mod=S.hint;S.hint=null}S.aud={rec:0,done:0,dur:0,text:''};S.cur=null;S.fin=0;S.i=0;S.v='cap';S.an=true;S.chat=false;render();setTimeout(()=>{S.an=false;if(S.v=='cap')render()},1600)}
function pick(f){if(!f)return;const r=new FileReader();r.onload=()=>begin(f,r.result);r.readAsDataURL(f)}
function recUI(){const b=$('rb');if(!b)return;b.className=holdCls(S.aud.rec)+' mx-auto';$('rl').textContent=S.aud.rec?T('rel'):T('hold')}
function startRec(){if(S.aud.rec||S.v!='cap'||S.an)return;if(!S.perm.mic){toast(T('tMic'));return}
S.aud={rec:1,done:0,dur:0,text:'',t0:Date.now()};recUI();
rr=null;try{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){rr=new SR();rr.interimResults=true;rr.continuous=true;rr.lang={en:'en-PH',tl:'fil-PH',ceb:'fil-PH'}[S.lang];rr.onresult=ev=>{S.aud.text=[...ev.results].map(r=>r[0].transcript).join(' ').trim()};rr.onerror=()=>{};rr.start()}}catch(e){rr=null}
ri=setInterval(()=>{const s=Math.floor((Date.now()-S.aud.t0)/1000),t=$('rt');if(t)t.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=60)stopRec()},200)}
function stopRec(){if(!S.aud.rec)return;clearInterval(ri);try{rr&&rr.stop()}catch(e){}
const ms=Date.now()-S.aud.t0;S.aud.rec=0;if(ms<700){S.aud={rec:0,done:0,dur:0,text:''};toast(T('tHold'));render();return}
const dur=Math.max(1,Math.round(ms/1000));setTimeout(()=>{const raw=S.aud.text;S.aud={rec:0,done:1,dur,text:raw?'“'+raw+'”':T('demoV')};if(S.v=='cap')render()},350)}
function speak(){try{speechSynthesis.cancel();const m=MOD(S.ev.mod),u=new SpeechSynthesisUtterance(stepsOf(m)[S.i]);u.lang={en:'en-US',tl:'fil-PH',ceb:'fil-PH'}[S.lang];speechSynthesis.speak(u)}catch(e){}}
function finish(){try{speechSynthesis.cancel()}catch(e){}const e={mod:S.ev.mod,scene:S.ev.scene,lq:curTier(),dur:S.aud.done?S.aud.dur:0,text:S.aud.done?S.aud.text:''};
if(S.cur)Object.assign(S.cur,e);else{S.cur={id:Date.now(),ts:Date.now(),...e};S.hist.unshift(S.cur)}save();S.fin=1;locate()}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act,d=t.dataset;
if((a=='bg'||a=='bgc')&&e.target!==t)return;
({go(){if(d.v=='learn')S.prev=S.v;if(d.v=='auth')S.fs=0;S.v=d.v;S.modal='';render();scrollTo(0,0)},slide(){S.slide=+d.n;render()},lang(){S.lang=d.l;render()},
terms(){if(!S.read){openTC();return}S.terms=S.terms?0:1;render()},pw(){S.pw=!S.pw;const i=document.querySelector('input[name=pw]');if(i)i.type=S.pw?'text':'password';t.setAttribute('aria-pressed',S.pw);t.setAttribute('aria-label',S.pw?T('hidePw'):T('showPw'));t.innerHTML=ic(S.pw?'eye-off':'eye')},tcjump(){openTC()},forgot(){S.fs=0;S.v='forgot';render();scrollTo(0,0)},fsend(){const m=(S.f.email||'').trim();if(!/^\S+@\S+\.\S+$/.test(m)){toast(T('fBad'));return}const again=S.fs;S.fs=1;render();if(again)toast(T('fResent'))},scan(){scanNow()},tx(){const e=curE();e.tx=S.net=='off'?'queued':'sent';save();toast(T(e.tx=='sent'?'txSent':'txQ'));render()},sms(){if(!S.perm.sms){toast(T('smsOff'));return}const e=curE(),n=(S.f.ems??'911').replace(/[^\d+]/g,'');if(!n){toast(T('numBad'));return}e.sms=1;save();location.href=`sms:${n}${/iPhone|iPad|Mac/.test(navigator.userAgent)?'&':'?'}body=${encodeURIComponent(smsText(e))}`},tab(){S.tab=d.v;render()},
auth(){const f=S.f;if(!f.email||!f.pw){toast(T('enterBoth'));return}S.user=(S.tab=='up'&&f.name)?f.name:f.email.split('@')[0];S.v='perm';render()},
guest(){S.user=null;S.v='perm';render()},
perm(){const v=+d.a;S.perm={cam:v,mic:v,loc:v,gal:v,sms:v};S.v='home';render();if(!v)toast(T('tLim'))},
out(){S.user=null;S.v=S.terms?'auth':'onb';render()},
pick(){if(d.k=='fg'&&!S.perm.gal){toast(T('tPh'));return}if(d.k=='fc'&&!S.perm.cam){toast(T('camOff'));return}$(d.k).click()},
setmod(){S.ev.mod=d.v;render()},setsc(){S.ev.scene=d.v;render()},hold(){},
steps(){S.i=0;S.fin=0;S.v='tri';render();scrollTo(0,0);if(S.voice)speak()},
cat(){S.chat=false;S.mod=d.id;S.sub=0;S.v='mod';render();scrollTo(0,0)},sub(){S.sub=+d.v;render()},
open(){S.open=d.id;S.v='hdet';render();scrollTo(0,0)},
dk(){S.dark=!S.dark;try{localStorage.setItem('agap-dark',S.dark?'1':'0')}catch(e){}render()},
next(){const n=stepsOf(MOD(S.ev.mod)).length;if(S.i==n-1)finish();else S.i++;render();scrollTo(0,0);if(S.voice&&!S.fin)speak()},
prev(){if(S.i>0)S.i--;render();if(S.voice)speak()},first(){S.fin=0;S.i=0;render();scrollTo(0,0);if(S.voice)speak()},
voice(){S.voice=!S.voice;render();if(S.voice)speak();else try{speechSynthesis.cancel()}catch(e){}},
subs(){S.modal=`<h3 class="text-xl font-extrabold">${f(T('subsT'),{s:SCL(S.ev.scene)})}</h3><p class="text-sm text-slate-500 font-semibold">${T('subsD')}</p>${SUBS[S.ev.scene].map(x=>{const[p,q]=x.split('|');return `<p class="bg-[#CEECF2]/60 rounded-2xl p-3 font-bold"><span class="block text-xs text-[#0B7ABF]">${p}</span>${q}</p>`}).join('')}`;render()},
call(){S.modal=`<h3 class="text-xl font-extrabold">${T('cHelp')}</h3><a href="tel:911" class="${Y} w-full py-4 text-lg">${ic('phone')}<span>${T('c911')}</span></a>`;render()},
chip(){reply(d.q)},send(){const i=$('q');if(i.value.trim()){reply(i.value.trim());$('q')?.focus()}},
mic(){if(!S.perm.mic){toast(T('tMic'));return}S.listen=!S.listen;render();if(S.listen)setTimeout(()=>{S.listen=false;reply(T('demoQ'))},1800)},
chat(){S.chat=true;render()},closechat(){S.chat=false;render()},bgc(){S.chat=false;render()},
net(){S.net=({lte:'2g','2g':'off',off:'lte'})[S.net];if(S.net!='off'){S.hist.forEach(x=>{if(x.tx=='queued')x.tx='sent'});save()}render()},env(){S.env=d.v;render()},tg(){S.perm[d.k]=S.perm[d.k]?0:1;render()},
fstep(){goFStep(+d.k)},fprev(){const k=curFIdx();if(k>0)goFStep(k-1)},fnext(){const k=curFIdx();goFStep(k<0||k>=FSTEPS.length-1?0:k+1)},
close(){S.modal='';render()},bg(){S.modal='';render()}})[a]()});
document.addEventListener('scroll',e=>{const b=e.target;if(b&&b.id=='tcbox'&&!S.read&&b.scrollTop+b.clientHeight>=b.scrollHeight-8){S.read=1;const c=$('tc');if(c){c.disabled=false;c.classList.remove('opacity-40')}const h=$('th');if(h)h.textContent=''}},true);
document.addEventListener('change',e=>{if(e.target.id=='fc'||e.target.id=='fg')pick(e.target.files[0])});
document.addEventListener('input',e=>{if(e.target.name)S.f[e.target.name]=e.target.value});
document.addEventListener('pointerdown',e=>{if(e.target.closest('[data-act=hold]'))startRec()});
['pointerup','pointercancel'].forEach(k=>document.addEventListener(k,stopRec));
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-act=hold]'))e.preventDefault()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='q')document.querySelector('[data-act=send]').click();else if((e.key==' '||e.key=='Enter')&&e.target.dataset.act=='hold'&&!e.repeat){e.preventDefault();startRec()}});
document.addEventListener('keyup',e=>{if((e.key==' '||e.key=='Enter')&&e.target.dataset&&e.target.dataset.act=='hold')stopRec()});
setInterval(()=>{const c=$('clk');if(c)c.textContent=clock()},10000);
try{navigator.getBattery().then(b=>{S.bat=Math.round(b.level*100);if(!S.rec&&!S.aud.rec)render()})}catch(e){}
render();setTimeout(()=>{if(S.v=='splash'){S.v='onb';render()}},1600);
</script></body></html>
